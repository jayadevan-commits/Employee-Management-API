loginMfaVerify:
  handler: src/handlers/users/loginMfaVerifyHandler.loginMfaVerify
  events:
    - http:
        path: /users/mfa/login-verify
        method: post
        cors: true

verifyMfa:
  handler: verifyMfaHandler.verifyMfa
  name: survey-training-${self:provider.stage}-verify-mfa
  package:
    patterns:
      - '../../src/service/users_management/verifyMfaHandler.mjs'
  environment:
    <<: *envConfig
  events:
    - http:
        path: /users/mfa/verify
        method: post
        cors: true
        authorizer:
          type: COGNITO_USER_POOLS
          authorizerId: ${param:ApiGatewayAuthorizerId}
functions:

  getUserMeTest:
    handler: app/handlers/users.get_user_me_test
    events:
      - http:
          path: users/me/test
          method: get
          authorizer:
            type: COGNITO_USER_POOLS
            authorizerId:
              Ref: ApiGatewayAuthorizer